# JVM args: enough headroom for Kotlin + KSP, GC friendly for long dev sessions
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# JDK 21 required by AGP 9.x; user-local Zulu install (no sudo needed).
org.gradle.java.home=/Users/mohdhadi/jdks/zulu21.52.203-ca-jdk21.0.12.1-macosx_aarch64/Contents/Home
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 built-in Kotlin (KSP 2.3.x supports it; old KSP 2.2.x does not).
android.builtInKotlin=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
